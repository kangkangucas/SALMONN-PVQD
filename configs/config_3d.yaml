# Configuration for 3D Model Evaluation
# 3D = 3 tasks combined: breathiness, roughness, strain
# Uses the same PVQD test data files

model:
  # paths
  llama_path: "./llama_path/vicuna-7b-v1.5"
  whisper_path: "./whisper_path"
  beats_path: "./beats_path/BEATs_iter3_plus_AS2M_finetuned_on_AS2M_cpt2.pt"

  ckpt: "./ckpt/finetuned_SALMONN_7B_2.pth" # model used for decoding

  freeze_whisper: True
  freeze_beats: True

  # window-level Q-Former
  use_speech_Qformer: True
  freeze_speech_QFormer: False
  window_level_Qformer: True
  num_speech_query_token: 1
  second_per_window: 0.333333
  second_stride: 0.333333

  speech_llama_proj_model: ""
  freeze_speech_llama_proj: False

  # LoRA
  lora: True
  lora_rank: 8
  lora_alpha: 32
  lora_dropout: 0.05

  multi_prompt: True
  prompt_template: "USER: {}\nASSISTANT:"
  prompt_path: "prompts/train_prompts_pvqd.json"
  test_prompt_path: "prompts/test_prompts_pvqd.json"
  max_txt_len: 300
  end_sym: "</s>"

datasets:
  # 3D Model Test Data Paths (same PVQD test files)
  test_task_paths:
    breathiness: "fang_data_prepare/splits_pvqd/breathiness_test.json"
    roughness: "fang_data_prepare/splits_pvqd/roughness_test.json"
    strain: "fang_data_prepare/splits_pvqd/strain_test.json"

  whisper_path: "./whisper_path"

  # Balanced sampling settings
  use_balanced_sampler: True

run:
  # log & settings
  seed: 42
  output_dir: "./output_dir_3d"
  evaluate: False

  log_freq: 5
  epoch_based: False
  iters_per_epoch: 200
  accum_grad_iters: 1
  batch_size_train: 12
  batch_size_eval: 12
  num_workers: 8

  device: "cuda:0"
  use_distributed: False
  amp: True
  world_size: 1
  dist_url: "env://"

  # optimizer & scheduler
  optims:
    max_epoch: 6
    warmup_steps: 200
    warmup_start_lr: 1e-6
    init_lr: 3e-5
    min_lr: 1e-5
    weight_decay: 0.05
    beta2: 0.999

generate:
  max_new_tokens: 200
  num_beams: 4
  do_sample: False
  min_length: 1
  temperature: 1.0
  top_p: 0.9
  repetition_penalty: 1.0
  length_penalty: 1.0

